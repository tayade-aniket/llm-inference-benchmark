# Tier B: Optional Remote GPU Inference Configuration (Google Colab / Kaggle Free GPU)
# NOT TO BE RUN ON LOCAL 4GB WINDOWS CPU

runtime:
  target: "remote_linux_gpu"
  recommended_environment: "Google Colab (T4 16GB) or Kaggle GPU (T4 x 2)"
  os: "Linux x86_64"
  cuda_version: "12.1"

models:
  primary_8b:
    repo_id: "meta-llama/Meta-Llama-3-8B-Instruct"
    quantized_repo_id: "casperhansen/llama-3-70b-instruct-awq" # or 8B AWQ
    parameter_count: "8.03B"

engines:
  vllm:
    enabled: true
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 2048
    enable_prefix_caching: true
    kv_cache_dtype: "auto"
  huggingface_gpu:
    enabled: true
    torch_dtype: "float16"
    device_map: "cuda:0"
